{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Customer Signal Detector
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/dashboard.css' %}"
    >
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="brand">
                <div class="brand-icon">
                    AI
                </div>

                <div>
                    <h2>Signal Detector</h2>
                    <span>Customer Operations</span>
                </div>
            </div>

            <nav class="navigation">

                <a href="/" class="nav-link active">
                    <span>Overview</span>
                </a>

                <a href="#" class="nav-link">
                    <span>Customer Signals</span>
                </a>

                <a href="#" class="nav-link">
                    <span>Model Insights</span>
                </a>

                <a href="#" class="nav-link">
                    <span>Data / Demo</span>
                </a>

            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            {% block content %}
            {% endblock %}

        </main>

    </div>


    <script src="{% static 'js/dashboard.js' %}"></script>

</body>
</html>
