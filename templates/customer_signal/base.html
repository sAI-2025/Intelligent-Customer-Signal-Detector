<!-- customer_signal/templates/customer_signal/base.html -->
{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>
      {% block title %}Intelligent Customer Signal Detector{% endblock %}
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-dot"></span>
          <span class="brand-text"
            >Intelligent Customer<br />Signal Detector</span
          >
        </div>
        <nav class="sidebar-nav">
          <a
            href="{% url 'overview' %}"
            class="nav-item {% if request.resolver_match.url_name == 'overview' %}active{% endif %}"
          >
            <span class="nav-icon">🏠</span
            ><span class="nav-label">Overview</span>
          </a>
          <a
            href="{% url 'customer_signals' %}"
            class="nav-item {% if request.resolver_match.url_name == 'customer_signals' or request.resolver_match.url_name == 'customer_detail' %}active{% endif %}"
          >
            <span class="nav-icon">👥</span
            ><span class="nav-label">Customer Signals</span>
          </a>
          <a
            href="{% url 'model_insights' %}"
            class="nav-item {% if request.resolver_match.url_name == 'model_insights' %}active{% endif %}"
          >
            <span class="nav-icon">📊</span
            ><span class="nav-label">Model Insights</span>
          </a>
          <a
            href="{% url 'data_upload' %}"
            class="nav-item {% if request.resolver_match.url_name == 'data_upload' %}active{% endif %}"
          >
            <span class="nav-icon">⚙</span
            ><span class="nav-label">Data / Upload</span>
          </a>
        </nav>
      </aside>

      <main class="main-content">
        <div id="toast-container" class="toast-container"></div>
        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="{% static 'js/dashboard.js' %}"></script>
    <script>
      // expose CSRF token for our frontend fetch calls
      (function () {
        var m = document.querySelector('meta[name="csrf-token"]');
        window.CSRF_TOKEN = m ? m.getAttribute("content") : "";
      })();
    </script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
